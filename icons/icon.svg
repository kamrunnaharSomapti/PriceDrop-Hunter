<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- PriceDrop Hunter logo: shopping bag + "price drop" arrow badge. Source for icons/*.png -->
  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <!-- Handle -->
  <path d="M42 50V38a22 22 0 0 1 44 0v12" fill="none" stroke="#0d9488" stroke-width="10" stroke-linecap="round"/>
  <!-- Bag body -->
  <path d="M24 46h80l6 62a12 12 0 0 1-12 13H30a12 12 0 0 1-12-13z" fill="url(#bag)"/>
  <!-- Top fold highlight -->
  <path d="M24 46h80l1 10H23z" fill="#5eead4" opacity=".45"/>
  <!-- Handle holes -->
  <circle cx="42" cy="58" r="5" fill="#0b5d56"/>
  <circle cx="86" cy="58" r="5" fill="#0b5d56"/>
  <!-- Price-drop badge -->
  <circle cx="94" cy="94" r="28" fill="#f97316" stroke="#ffffff" stroke-width="6"/>
  <path d="M94 79v27M83 96l11 11 11-11" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
