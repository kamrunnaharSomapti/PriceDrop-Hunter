<!doctype html>
<!-- Small mock of a Next.js fashion store's sale grid (modeled on lerevecraze.com/product-category/sale).

<html lang="en"><head><meta charset="utf-8"><title>Sale | Le Reve</title></head>

<header><a href="/">le reve</a><nav><a href="/winter">Winter</a><a href="/women">Women</a><a class="btn-sale" href="/product-category/sale/">Sale</a></nav></header>
